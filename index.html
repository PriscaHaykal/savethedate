<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prisca & Fady — Save the Date</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500&display=swap');
:root{--ivory:#fcfaf5;--green:#758c76;--pink:#d9b8b3;--gold:#c9b681;--ink:#55534b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e6e3dc}
body{font-family:Montserrat,sans-serif;color:var(--ink);display:flex;justify-content:center}
.page{width:min(100%,430px);min-height:100vh;padding:14px 8px;display:flex;align-items:center;justify-content:center}
.card{position:relative;width:100%;min-height:calc(100vh - 28px);background:var(--ivory);overflow:hidden;box-shadow:0 18px 55px rgba(55,55,45,.13);padding:18px}
.content{position:relative;z-index:2;min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:54px 22px 42px}
.eyebrow,.names,.date,.countdown-title,.footer{transition:opacity .65s ease,transform .65s ease}
.eyebrow{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:24px;line-height:1.05;letter-spacing:.7px;margin:0 0 7px;color:#4d554e}
.names{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:46px;font-weight:500;line-height:.95;margin:0;color:#4d554e}
.date{font-family:"Cormorant Garamond",serif;font-size:18px;letter-spacing:3px;margin:11px 0 17px;color:#6f766d}
.reveal-photo{width:min(100%,300px);aspect-ratio:1/1;position:relative;border-radius:50%;overflow:hidden;background:#e8eee5;box-shadow:0 6px 24px rgba(78,96,78,.13);border:5px solid #fff}
.photo{width:100%;height:100%;object-fit:cover;display:block}
.countdown-title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;margin-top:19px;color:#5f685f}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:5px;width:min(100%,310px)}
.countdown strong{display:block;font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;color:#4e584f}
.countdown span{font-size:7px;letter-spacing:1.1px;text-transform:uppercase;color:#81867e}
.footer{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:16px;margin-top:15px;color:#72776f}
/* The scratch layer covers only the invitation interior, so the ornate border stays visible. */
#scratchCanvas{position:absolute;z-index:7;left:27px;right:27px;top:27px;bottom:27px;width:calc(100% - 54px);height:calc(100% - 54px);touch-action:none;cursor:crosshair}
.frame{position:absolute;inset:10px;background:url("frame.jpeg") 0 0/100% 100% no-repeat;pointer-events:none;z-index:10;opacity:.82}
.scratch-hint{position:absolute;z-index:8;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:#687267;text-shadow:0 1px 2px #fff;opacity:1;transition:opacity .7s}
.card.scratching .scratch-hint{opacity:0}
.card.stage1 .eyebrow,.card.stage2 .eyebrow,.card.stage3 .eyebrow,.card.stage4 .eyebrow{opacity:1;transform:none}
.card.stage2 .names,.card.stage3 .names,.card.stage4 .names{opacity:1;transform:none}
.card.stage3 .date,.card.stage4 .date{opacity:1;transform:none}
.card.stage4 .countdown-title,.card.stage4 .countdown,.card.stage4 .footer{opacity:1;transform:none}
.eyebrow,.names,.date,.countdown-title,.footer{opacity:0;transform:translateY(8px)}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:12}
@media(max-width:360px){.names{font-size:39px}.reveal-photo{max-width:255px}}
</style>
</head>
<body>
<div class="page">
<section class="card" id="card">
  <canvas id="confetti"></canvas>
  <div class="content">
    <div class="eyebrow">We are getting married</div>
    <h1 class="names">Prisca &amp; Fady</h1>
    <div class="date">25 JULY 2027</div>
    <div class="reveal-photo"><img class="photo" src="photo.jpg" alt="Prisca & Fady"></div>
    <div class="countdown-title">Counting down to our day...</div>
    <div class="countdown">
      <div><strong id="days">0</strong><span>Days</span></div>
      <div><strong id="hours">00</strong><span>Hours</span></div>
      <div><strong id="minutes">00</strong><span>Minutes</span></div>
      <div><strong id="seconds">00</strong><span>Seconds</span></div>
    </div>
    <div class="footer">We can't wait to celebrate with you.</div>
  </div>
  <canvas id="scratchCanvas"></canvas>
  <div class="scratch-hint">Scratch to reveal ♡</div>
  <div class="frame"></div>
</section>
</div>
<script>
const weddingDate=new Date("2027-07-25T00:00:00+02:00");
function updateCountdown(){const diff=Math.max(0,weddingDate-new Date()),s=Math.floor(diff/1000);document.getElementById('days').textContent=Math.floor(s/86400);document.getElementById('hours').textContent=String(Math.floor(s%86400/3600)).padStart(2,'0');document.getElementById('minutes').textContent=String(Math.floor(s%3600/60)).padStart(2,'0');document.getElementById('seconds').textContent=String(s%60).padStart(2,'0')}
updateCountdown();setInterval(updateCountdown,1000);
const canvas=document.getElementById('scratchCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),card=document.getElementById('card');let drawing=false,revealed=false,stage=0,everScratched=false;
function setup(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#f5f1e9');g.addColorStop(.42,'#e1e8df');g.addColorStop(.72,'#f1e2df');g.addColorStop(1,'#eee8dc');ctx.globalCompositeOperation='source-over';ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);ctx.globalAlpha=.13;for(let i=0;i<2300;i++){ctx.fillStyle=i%4===0?'#d7a9a7':i%2?'#ffffff':'#799079';ctx.fillRect(Math.random()*r.width,Math.random()*r.height,1,1)}ctx.globalAlpha=1;ctx.fillStyle='rgba(83,94,83,.72)';ctx.font='italic 22px "Cormorant Garamond",serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SCRATCH TO REVEAL',r.width/2,r.height/2);ctx.globalCompositeOperation='destination-out'}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function scratch(e){if(revealed)return;if(!everScratched){everScratched=true;card.classList.add('scratching')}const p=point(e);ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.fill();if(Math.random()<.08)measure()}
function measure(){const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;for(let i=3;i<data.length;i+=48){total++;if(data[i]<80)clear++}const pct=clear/total;if(pct>.10&&stage<1){stage=1;card.classList.add('stage1')}if(pct>.24&&stage<2){stage=2;card.classList.add('stage2')}if(pct>.39&&stage<3){stage=3;card.classList.add('stage3')}if(pct>.54&&stage<4){stage=4;card.classList.add('stage4');finish()}}
function finish(){revealed=true;canvas.style.transition='opacity .8s ease';canvas.style.opacity='0';launchConfetti();setTimeout(()=>canvas.remove(),850)}
canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);scratch(e)});canvas.addEventListener('pointermove',e=>{if(drawing)scratch(e)});canvas.addEventListener('pointerup',()=>{drawing=false;measure()});canvas.addEventListener('pointercancel',()=>drawing=false);window.addEventListener('resize',()=>{if(!revealed)setup()});setup();
function launchConfetti(){const c=document.getElementById('confetti'),x=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=r.width*dpr;c.height=r.height*dpr;x.setTransform(dpr,0,0,dpr,0,0);const colors=['#758c76','#d9b8b3','#c9b681','#f4efe4'],pieces=[];for(let i=0;i<85;i++){pieces.push({x:r.width*.24+Math.random()*r.width*.52,y:r.height*.34+Math.random()*r.height*.12,vx:(Math.random()-.5)*2.3,vy:Math.random()*1.3+.5,r:Math.random()*3+2,a:1,rot:Math.random()*6.28,vr:(Math.random()-.5)*.2,color:colors[i%colors.length]})}let start=null;function anim(t){if(!start)start=t;const p=Math.min(1,(t-start)/2300);x.clearRect(0,0,r.width,r.height);pieces.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.015;q.rot+=q.vr;q.a=1-p;x.save();x.globalAlpha=Math.max(0,q.a);x.translate(q.x,q.y);x.rotate(q.rot);x.fillStyle=q.color;x.fillRect(-q.r/2,-q.r/2,q.r,q.r*1.7);x.restore()});if(p<1)requestAnimationFrame(anim);else x.clearRect(0,0,r.width,r.height)}requestAnimationFrame(anim)}
</script>
</body>
</html>
