<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Prisca & Fady — Save the Date</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e9e5db;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif}
.card{position:relative;container-type:inline-size;aspect-ratio:736/1037;
  width:min(calc(100vw - 16px),430px,calc((100dvh - 16px)*736/1037));
  background:#fefaf0 url("frame.jpeg") center/100% 100% no-repeat;
  box-shadow:0 18px 55px rgba(55,55,45,.16);overflow:hidden}
/* Final design, hidden under the oval until the card is scratched */
.reveal{position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse at 50% 40%,#f3f3f1,#e6e6e3);
  clip-path:ellipse(33% 37.5% at 50% 50%);transition:clip-path 1.6s ease}
.card.open .reveal{clip-path:ellipse(85% 85% at 50% 50%)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card:not(.show-text) .text{display:none}
.text{position:absolute;left:29%;right:29%;top:35%;bottom:20%;display:flex;flex-direction:column;align-items:center;text-align:center;color:#b18f8b}
.tag{font-style:italic;font-size:3.3cqw;line-height:1.25;margin:0 0 5cqw;color:#a98f8a}
.names{font-weight:500;font-size:8.2cqw;letter-spacing:1.5cqw;margin:0;line-height:1.1;color:#c4a29d;text-shadow:0 1px 0 #fff,0 0 8px rgba(255,255,255,.9);padding-left:1.5cqw}
.amp{font-style:italic;font-size:6cqw;margin:.8cqw 0;color:#d1b6a8}
.invite{font-size:3.1cqw;line-height:1.3;margin:7cqw 0 2.4cqw;color:#a98f8a}
.date{font-style:italic;font-size:4.6cqw;letter-spacing:.5cqw;color:#9d7f7a}
.count{font-size:2.9cqw;letter-spacing:.2cqw;margin-top:2.2cqw;color:#a98f8a}
.count b{font-weight:600;font-size:3.6cqw}
#scratch{position:absolute;left:17%;top:12.5%;width:66%;height:75%;z-index:5;touch-action:none;cursor:crosshair;transition:opacity .9s ease}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
</style>
</head>
<body>
<section class="card" id="card">
  <div class="reveal">
    <img class="art" src="photo.png" alt="Prisca &amp; Fady — Save the Date">
    <div class="text">
      <p class="tag">We are getting married</p>
      <h1 class="names">PRISCA</h1>
      <div class="amp">&amp;</div>
      <h1 class="names">FADY</h1>
      <div class="invite">Save the date<br>for our wedding day</div>
      <div class="date">25 July 2027</div>
      <div class="count"><b id="d">0</b> days · <b id="h">00</b>h <b id="m">00</b>m <b id="s">00</b>s</div>
    </div>
  </div>
  <canvas id="scratch"></canvas>
  <canvas id="confetti"></canvas>
</section>
<script>
/* ---------- Countdown ---------- */
const weddingDate=new Date("2027-07-25T00:00:00+02:00");
function tick(){const s=Math.floor(Math.max(0,weddingDate-new Date())/1000);
d.textContent=Math.floor(s/86400);h.textContent=String(Math.floor(s%86400/3600)).padStart(2,'0');
m.textContent=String(Math.floor(s%3600/60)).padStart(2,'0');document.getElementById('s').textContent=String(s%60).padStart(2,'0')}
tick();setInterval(tick,1000);

/* ---------- Scratch ---------- */
const cv=document.getElementById('scratch'),ctx=cv.getContext('2d',{willReadFrequently:true}),card=document.getElementById('card');
let drawing=false,done=false,base=1,last=0,W=0,H=0;
function count(){const a=ctx.getImageData(0,0,cv.width,cv.height).data;let n=0;for(let i=3;i<a.length;i+=40)if(a[i]>128)n++;return n||1}
function setup(){
  const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
  ctx.save();ctx.beginPath();ctx.ellipse(W/2,H/2,W/2-1,H/2-1,0,0,Math.PI*2);ctx.clip();
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#efe7d4');g.addColorStop(.35,'#dfe7dc');g.addColorStop(.7,'#f1dfdb');g.addColorStop(1,'#e9dfc6');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.16;
  for(let i=0;i<2600;i++){ctx.fillStyle=i%4===0?'#d7a9a7':i%2?'#ffffff':'#b9a46a';ctx.fillRect(Math.random()*W,Math.random()*H,1.2,1.2)}
  ctx.globalAlpha=1;ctx.restore();
  ctx.strokeStyle='rgba(201,182,129,.95)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(W/2,H/2,W/2-2,H/2-2,0,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(W/2,H/2,W/2-10,H/2-10,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(83,94,83,.8)';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='italic '+(W*.085)+'px "Cormorant Garamond",serif';
  ctx.fillText('SCRATCH',W/2,H/2-W*.07);ctx.fillText('TO REVEAL',W/2,H/2+W*.03);
  ctx.font=(W*.09)+'px serif';ctx.fillStyle='rgba(201,150,150,.95)';ctx.fillText('♡',W/2,H/2+W*.17);
  base=count();ctx.globalCompositeOperation='destination-out';
}
function measure(){if(!done&&1-count()/base>.5)finish()}
function scratch(e){if(done)return;const r=cv.getBoundingClientRect();
  ctx.beginPath();ctx.arc(e.clientX-r.left,e.clientY-r.top,W*.075,0,Math.PI*2);ctx.fill();
  const t=performance.now();if(t-last>120){last=t;measure()}}
function finish(){done=true;card.classList.add('open');cv.style.opacity='0';cv.style.pointerEvents='none';goldConfetti();setTimeout(()=>cv.remove(),950)}
cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);scratch(e)});
cv.addEventListener('pointermove',e=>{if(drawing)scratch(e)});
cv.addEventListener('pointerup',()=>{drawing=false;measure()});
cv.addEventListener('pointercancel',()=>drawing=false);
window.addEventListener('resize',()=>{if(!done&&!drawing)setup()});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(setup);

/* ---------- Gold confetti ---------- */
function goldConfetti(){
  const c=document.getElementById('confetti'),x=c.getContext('2d'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  c.width=r.width*dpr;c.height=r.height*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const gold=['#c9a24a','#d9b86a','#e7cf8f','#b98f2f','#f3e2ae','#a8812a'],P=[];
  for(let i=0;i<170;i++){const a=Math.random()*Math.PI*2,v=Math.random()*5+1.5;
    P.push({x:r.width/2,y:r.height*.45,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2.2,w:Math.random()*5+3,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,ph:Math.random()*6.28,c:gold[i%6],round:i%4===0})}
  let t0=null;
  (function f(t){if(!t0)t0=t;const p=Math.min(1,(t-t0)/4200);x.clearRect(0,0,r.width,r.height);
    P.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vx*=.985;q.vy=q.vy*.985+.07;q.rot+=q.vr;
      x.save();x.globalAlpha=Math.max(0,1-p*p)*(.65+.35*Math.sin(t/90+q.ph));x.translate(q.x,q.y);x.rotate(q.rot);x.fillStyle=q.c;
      if(q.round){x.beginPath();x.arc(0,0,q.w*.45,0,6.3);x.fill()}else x.fillRect(-q.w/2,-q.w*.4,q.w,q.w*.8);x.restore()});
    if(p<1)requestAnimationFrame(f);else x.clearRect(0,0,r.width,r.height)})(performance.now());
}
</script>
</body>
</html>
